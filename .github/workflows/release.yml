name: Desktop releases

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "1"
  UV_NO_PROGRESS: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            rid: win-x64
            source_args: ""
          - runner: ubuntu-22.04
            rid: linux-x64
            source_args: --include-qt-sources
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: desktop/global.json

      - name: Install Linux display and native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 tk8.6 xvfb xauth

      - name: Install locked Python dependencies
        run: uv sync --frozen --extra desktop --extra desktop-build --python 3.12.14

      - name: Lint and check formatting
        run: |
          uv run --frozen --extra desktop --extra desktop-build ruff check tools desktop scripts tests
          uv run --frozen --extra desktop --extra desktop-build ruff format --check tools desktop scripts tests

      - name: Run desktop tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --frozen --extra desktop --extra desktop-build pytest -q --tb=short

      - name: Run desktop tests on Windows
        if: runner.os == 'Windows'
        run: uv run --frozen --extra desktop --extra desktop-build pytest -q --tb=short

      - name: Build and self-test standalone executable
        run: >-
          uv run --frozen --extra desktop --extra desktop-build
          python desktop/build_desktop.py --onefile
          --rid "${{ matrix.rid }}" --output "$RUNNER_TEMP/cs-build"

      - name: Stage executable, notices and corresponding sources
        run: >-
          uv run --frozen --extra desktop --extra desktop-build
          python desktop/package_release.py stage
          --build "$RUNNER_TEMP/cs-build" --rid "${{ matrix.rid }}"
          --output artifacts/release ${{ matrix.source_args }}

      - name: Upload verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.rid }}-release
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact tagged application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for checksums
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
          architecture: x64

      - name: Download both verified builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-release"
          merge-multiple: true
          path: release-assets

      - name: Include matching application source and checksums
        run: |
          git archive --format=tar.gz --prefix=CollectionsStudio/ \
            --output=release-assets/CollectionsStudio-source.tar.gz HEAD
          python desktop/package_release.py checksums release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          Windows: run CollectionsStudio-windows-x64.exe; no installer is needed.
          Linux: chmod +x CollectionsStudio-linux-x64, then run it directly; no AppImage is used.

          Credits and licences are available inside the app. Matching application and
          Qt/PySide/Shiboken sources, platform notices and SHA256SUMS accompany these
          executables. Rebuilding/library replacement instructions are in REBUILDING.md
          inside the platform notices ZIPs. Keep the source and notice assets with redistributions.
          NOTES
          args=(--verify-tag --generate-notes --notes-file release-notes.md --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" release-assets/*
