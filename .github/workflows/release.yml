name: Desktop releases

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "1"
  UV_NO_PROGRESS: "1"
  UV_MANAGED_PYTHON: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, Windows, X64, collections-studio-windows]
            rid: win-x64
            source_args: ""
          - runner: [self-hosted, Linux, X64, collections-studio-linux]
            rid: linux-x64
            source_args: --include-qt-sources
    defaults:
      run:
        shell: bash
    steps:
      - name: Find Git Bash on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $candidates = @((Join-Path $env:ProgramFiles 'Git\bin\bash.exe'))
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if ($git) {
            $gitRoot = Split-Path (Split-Path $git.Source -Parent) -Parent
            $candidates += Join-Path $gitRoot 'bin\bash.exe'
          }
          $bash = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $bash) { throw 'Install Git for Windows system-wide, then restart this runner service.' }
          Split-Path $bash -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and pinned Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.19"
          python-version: "3.12.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned managed Python
        run: uv python install 3.12.14

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: desktop/global.json
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet

      - name: Check Linux display tooling
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run
          command -v xauth
          command -v strip

      - name: Install locked Python dependencies
        run: uv sync --frozen --extra desktop --extra desktop-build --python 3.12.14

      - name: Lint and check formatting
        run: |
          uv run --frozen --extra desktop --extra desktop-build ruff check tools desktop scripts tests
          uv run --frozen --extra desktop --extra desktop-build ruff format --check tools desktop scripts tests

      - name: Run desktop tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --frozen --extra desktop --extra desktop-build pytest -q -ra --tb=short --basetemp "$RUNNER_TEMP/pt"

      - name: Run desktop tests on Windows
        if: runner.os == 'Windows'
        run: uv run --frozen --extra desktop --extra desktop-build pytest -q -ra --tb=short --basetemp "$RUNNER_TEMP/pt"

      - name: Build and self-test standalone executable
        env:
          COLLECTIONS_STUDIO_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: >-
          uv run --frozen --extra desktop --extra desktop-build
          python desktop/build_desktop.py --onefile --profile release
          --rid "${{ matrix.rid }}" --output "$RUNNER_TEMP/cs-build-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Stage executable, notices and corresponding sources
        run: >-
          uv run --frozen --extra desktop --extra desktop-build
          python desktop/package_release.py stage
          --build "$RUNNER_TEMP/cs-build-${{ github.run_id }}-${{ github.run_attempt }}" --rid "${{ matrix.rid }}"
          --output artifacts/release ${{ matrix.source_args }}

      - name: Package and self-test additional Linux AppImage
        if: runner.os == 'Linux'
        run: >-
          uv run --frozen --extra desktop --extra desktop-build
          python desktop/package_appimage.py --input artifacts/release
          --cache "$RUNNER_TEMP/cs-appimage-cache"

      - name: Upload verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.rid }}-release
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  assemble:
    name: Assemble public release files
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact tagged application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and pinned Python for checksums
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.19"
          python-version: "3.12.14"
          enable-cache: false

      - name: Install pinned managed Python
        run: uv python install 3.12.14

      - name: Download both verified builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-x64-release"
          merge-multiple: true
          path: release-inputs

      - name: Assemble six public release files
        run: |
          git archive --format=tar.gz --prefix=CollectionsStudio/ \
            --output=release-inputs/CollectionsStudio-source.tar.gz HEAD
          uv run --no-project --python 3.12.14 python desktop/package_release.py assemble \
            --input release-inputs --output release-assets --require-appimage

      - name: Upload six assembled release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-release
          path: |
            release-assets/CollectionsStudio-windows-x64.exe
            release-assets/CollectionsStudio-linux-x64
            release-assets/CollectionsStudio-linux-x64.AppImage
            release-assets/LINUX_INSTALL.md
            release-assets/SHA256SUMS
            release-assets/CollectionsStudio-sources-and-notices.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download six assembled release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public-release
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          Windows: run CollectionsStudio-windows-x64.exe; no installer is needed.
          Linux: choose CollectionsStudio-linux-x64.AppImage or CollectionsStudio-linux-x64.
          See LINUX_INSTALL.md for launch, desktop shortcut and update instructions.
          The standalone binary retains automatic updates; this initial AppImage updates manually.

          Download only your platform's executable to run Collections Studio.
          SHA256SUMS verifies the downloads and is used by the built-in updater.

          CollectionsStudio-sources-and-notices.zip contains the matching application
          and Qt/PySide/Shiboken sources, both platform notice ZIPs and build/test records.
          Rebuilding/library replacement instructions are in REBUILDING.md inside the
          platform notice ZIPs. Credits and licences are also available inside the app.
          Keep the combined sources-and-notices archive with redistributions.
          NOTES
          args=(--verify-tag --generate-notes --notes-file release-notes.md --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          assets=(
            release-assets/CollectionsStudio-windows-x64.exe
            release-assets/CollectionsStudio-linux-x64
            release-assets/CollectionsStudio-linux-x64.AppImage
            release-assets/LINUX_INSTALL.md
            release-assets/SHA256SUMS
            release-assets/CollectionsStudio-sources-and-notices.zip
          )
          gh release create "$RELEASE_TAG" "${args[@]}" "${assets[@]}"
