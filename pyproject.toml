[project]
name = "collections-studio"
version = "0.1.5"
description = "Desktop editor for osu!stable and osu!lazer collections"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
desktop = ["pyside6-essentials==6.12.0"]
desktop-build = ["pyinstaller==6.22.3"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
